# پروفایل تست روی Oracle واقعی: mvn clean verify -Dtest.profile=oracle
# قبل از آن: جدول‌ها را آماده و DB_URL, DB_USERNAME, DB_PASSWORD را برای حساب دارای دسترسی لازم تنظیم کنید.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: validate   # تطابق Entityها با جدول‌های واقعی را هم بررسی می‌کند
