# پروفایل تست روی Oracle واقعی: mvn clean verify -Dtest.profile=oracle
# قبل از آن: DB_URL, DB_USERNAME, DB_PASSWORD را تنظیم و اسکریپت‌های scripts/02 و 03 و (فقط روی دیتابیس تست) 04 را اجرا کنید.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: validate   # تطابق Entityها با جدول‌های واقعی را هم بررسی می‌کند
