spring:
  datasource:
    url: jdbc:h2:mem:shafagh;MODE=Oracle;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS SHFQ_BASE\;CREATE SCHEMA IF NOT EXISTS SHFQ_CIF\;CREATE SCHEMA IF NOT EXISTS SHFQ_DPST\;CREATE SCHEMA IF NOT EXISTS SHFQ_LOAN
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

shafagh:
  persistence:
    module-datasources: false
